});

var touch=$('touch'),js=null,lk=null,ring=$('jsr');
function lockLand(){
  try{
    var sc=window.screen;if(S.ar!=='169'||!sc||!sc.orientation||!sc.orientation.lock)return;
    var go=function(){sc.orientation.lock('landscape').catch(function(){});};
    var st=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches;
    if(!st&&document.documentElement.requestFullscreen&&!document.fullscreenElement){document.documentElement.requestFullscreen().then(go).catch(function(){});}else go();
  }catch(e){}
}
$('rotGo').addEventListener('click',function(){S.ar='full';applyView();});
touch.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();lockLand();if(panelOpen)return;
  var r=touch.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width;
  if(lx<0.5&&!js){js={id:e.pointerId,sx:e.clientX,sy:e.clientY};ring.hidden=false;ring.style.left=(e.clientX-r.left)+'px';ring.style.top=(e.clientY-r.top)+'px';ring.firstElementChild.style.transform='translate(0px,0px)';}
  else if(lx>=0.5&&!lk){lk={id:e.pointerId,x:e.clientX,y:e.clientY};}
  try{touch.setPointerCapture(e.pointerId);}catch(er){}
});
touch.addEventListener('pointermove',function(e){
  if(js&&e.pointerId===js.id){var dx=e.clientX-js.sx,dy=e.clientY-js.sy,l=Math.hypot(dx,dy),R=55;if(l>R){dx=dx/l*R;dy=dy/l*R;}jsX=dx/R;jsY=-dy/R;ring.firstElementChild.style.transform='translate('+dx+'px,'+dy+'px)';}
  else if(lk&&e.pointerId===lk.id){P.yaw+=(e.clientX-lk.x)*0.0058;P.pitch-=(e.clientY-lk.y)*0.0058;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch));lk.x=e.clientX;lk.y=e.clientY;}
});
function endT(e){if(js&&e.pointerId===js.id){js=null;jsX=jsY=0;ring.hidden=true;}if(lk&&e.pointerId===lk.id)lk=null;}
touch.addEventListener('pointerup',endT);touch.addEventListener('pointercancel',endT);
touch.addEventListener('contextmenu',function(e){e.preventDefault();});
var releasers=[];
function holdBtn(id,on,off){
  var b=$(id),pid=null;
  function rel(){if(pid===null)return;pid=null;off();b.classList.remove('on');}
  b.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();ensureAudio();lockLand();pid=e.pointerId;try{b.setPointerCapture(e.pointerId);}catch(er){}on();b.classList.add('on');});
  b.addEventListener('pointerup',rel);b.addEventListener('pointercancel',rel);b.addEventListener('lostpointercapture',rel);
  window.addEventListener('pointerup',function(e){if(e.pointerId===pid)rel();});
  window.addEventListener('pointercancel',function(e){if(e.pointerId===pid)rel();});
  window.addEventListener('blur',rel);
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
  releasers.push(rel);
}
document.addEventListener('touchend',function(e){if(!e.touches||!e.touches.length)releasers.forEach(function(f){f();});});
holdBtn('bMine',function(){mineHeld=true;},function(){mineHeld=false;});
holdBtn('bJump',function(){jumpHeld=true;},function(){jumpHeld=false;});
$('bPlace').addEventListener('click',function(){ensureAudio();placeBlock();});
$('aDyn').addEventListener('click',function(){ensureAudio();useDyn();});
$('aPot').addEventListener('click',function(){ensureAudio();usePot();});
$('aRope').addEventListener('click',function(){ensureAudio();useRope();});
var KM={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};
document.addEventListener('keydown',function(e){
  if(panelOpen)return;var k=KM[e.key];
  if(k==='u')ky=1;else if(k==='d')ky=-1;else if(k==='l')kx=-1;else if(k==='r')kx=1;
  else if(e.key===' '){jumpHeld=true;e.preventDefault();}else if(e.key==='f'||e.key==='Enter')mineHeld=true;else if(e.key==='g')placeBlock();
});
document.addEventListener('keyup',function(e){
  var k=KM[e.key];
  if(k==='u'||k==='d')ky=0;else if(k==='l'||k==='r')kx=0;else if(e.key===' ')jumpHeld=false;else if(e.key==='f'||e.key==='Enter')mineHeld=false;
});
$('ctx').addEventListener('click',function(){ensureAudio();openBuilding($('ctx').dataset.id);});
$('bMenu').addEventListener('click',function(){ensureAudio();openPanel();$('box').dataset.k='menu';resetArm=false;renderMenu();});
document.addEventListener('visibilitychange',function(){musUpdate();if(document.hidden){jsX=jsY=0;mineHeld=false;jumpHeld=false;releasers.forEach(function(f){f();});save();}});
window.addEventListener('pagehide',save);
setInterval(function(){if(dirty)save();},8000);

/* ================= लूप ================= */
function updFwd(){var cp=Math.cos(P.pitch);FWD=[Math.sin(P.yaw)*cp,Math.sin(P.pitch),-Math.cos(P.yaw)*cp];}
var last=0,hn=0;
function frame(now){
  if(!last)last=now;
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  var i;
  if(!panelOpen){
    T+=dt;S.tod=(S.tod+dt/240)%1;
    updFwd();physics(dt);mining(dt);
    if(P.flash>0)P.flash-=dt;
    for(i=bombs.length-1;i>=0;i--){bombs[i].t-=dt;if(bombs[i].t<=0){var b=bombs.splice(i,1)[0];explode(b.x,b.y,b.z);}}
  }
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.vy-=14*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(--p.l<=0)parts.splice(i,1);}
  for(i=texts.length-1;i>=0;i--){var t=texts[i];t.y+=0.9*dt;if(--t.l<=0)texts.splice(i,1);}
  streamUpdate();buildBudget(5);flushRemesh();
  var info=renderGL();drawSky(info);drawOverlay();
  if(++hn%6===0)hud();
  requestAnimationFrame(frame);
}
applyView();
$('bSnd').textContent=S.mute?'🔇':'🔊';
$('bSnd').addEventListener('click',function(){S.mute=!S.mute;$('bSnd').textContent=S.mute?'🔇':'🔊';dirty=true;ensureAudio();musUpdate();if(!S.mute)sfx('coin');});
if(!gl){$('nogl').hidden=false;}
else{
  initGL();updFwd();streamUpdate();buildBudget(80);
  if(!S.intro){S.intro=true;toast('⛏️ हाथ से ऊपर-नीचे देखो और ⛏️ बटन दबाए रखो!');}
  hud();requestAnimationFrame(frame);
}
window.__M={S:S,P:P,gen:gen,getB:getB,setB:setB,physics:physics,mining:mining,raycast:raycast,buildMesh:buildMesh,chunks:chunks,doSell:doSell,doSellAll:doSellAll,doSmelt:doSmelt,doCraft:doCraft,doUp:doUp,doBuy:doBuy,sellTotal:sellTotal,placeBlock:placeBlock,breakBlock:breakBlock,explode:explode,updFwd:updFwd,bagCount:bagCount,ORES:ORES,heightAt:heightAt,keys:function(k,v){if(k==='mine')mineHeld=v;if(k==='jump')jumpHeld=v;if(k==='fw')ky=v;},tgt:function(){return tgt;},save:save};

})();
</script>
