<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070A18">
<title>Arcade · Pack 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#070A18;--bg2:#0E1330;--card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.11);--line:rgba(255,255,255,.12);--txt:#F4F6FF;--mut:#98A3C9;--a1:#7C5CFF;--a2:#FF4FA3;--a3:#22D3EE;--gold:#FFC83D;--ok:#2EE59D;--bad:#FF5C6C;--r:20px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#EEF1FF;--bg2:#DCE2FF;--card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.95);--line:rgba(30,40,100,.14);--txt:#12173A;--mut:#566096}}
:root[data-theme="light"]{--bg:#EEF1FF;--bg2:#DCE2FF;--card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.95);--line:rgba(30,40,100,.14);--txt:#12173A;--mut:#566096}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;color:var(--txt);font:500 16px/1.4 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
background:radial-gradient(900px 520px at 8% -8%,rgba(124,92,255,.38),transparent 60%),radial-gradient(800px 520px at 108% 8%,rgba(34,211,238,.26),transparent 60%),radial-gradient(700px 500px at 50% 112%,rgba(255,79,163,.22),transparent 60%),var(--bg)}
h1,h2,h3,.fx{font-family:"Outfit","Inter",system-ui,sans-serif;letter-spacing:-.01em}
#app{position:relative;height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
.glass{background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:var(--r)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.brand{font:800 1.25rem "Outfit",sans-serif;display:flex;align-items:center;gap:8px;flex:1}
.brand i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-style:normal;font-size:1rem;box-shadow:0 6px 18px rgba(124,92,255,.5)}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:700 .9rem "Outfit",sans-serif;white-space:nowrap}
.pill b{font-weight:800}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:1.05rem;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:active,.btn:active,.card:active,.node:active{transform:scale(.96)}
.btn{border:0;border-radius:16px;padding:13px 22px;font:700 1rem "Outfit",sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 24px rgba(124,92,255,.38);transition:transform .08s}
.btn.alt{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,#FFC83D,#FF8A3D);color:#2a1600;box-shadow:0 8px 24px rgba(255,170,60,.35)}
.btn.sm{padding:9px 14px;font-size:.88rem;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;box-shadow:none}
button:focus-visible{outline:3px solid var(--a3);outline-offset:2px}
.scroll{flex:1;min-height:0;overflow:auto;padding:6px 14px 28px;-webkit-overflow-scrolling:touch}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;margin:6px 0 14px;background:linear-gradient(135deg,rgba(124,92,255,.85),rgba(255,79,163,.8));box-shadow:0 14px 40px rgba(124,92,255,.35)}
.hero h1{margin:0 0 4px;font-size:1.7rem;line-height:1.05;font-weight:900}
.hero p{margin:0 0 12px;opacity:.92;max-width:26ch}
.hero .big{position:absolute;right:-8px;bottom:-18px;font-size:7rem;opacity:.9;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));transform:rotate(-8deg)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;font:800 1.05rem "Outfit",sans-serif}
.sec small{color:var(--mut);font:600 .78rem "Inter",sans-serif}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 6px}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:700 .85rem "Outfit",sans-serif;color:var(--mut);cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;overflow:hidden;border-radius:22px;padding:14px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);cursor:pointer;text-align:left;color:#fff;font:inherit;transition:transform .1s}
.card .ico{position:absolute;right:-6px;top:-4px;font-size:5.2rem;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));transform:rotate(8deg)}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55));z-index:0}
.card>*{position:relative;z-index:1}
.card h3{margin:0;font-size:1.1rem;line-height:1.1;font-weight:800}
.card p{margin:2px 0 0;font-size:.76rem;opacity:.9;line-height:1.25}
.tag{display:inline-block;align-self:flex-start;margin-bottom:6px;padding:2px 9px;border-radius:999px;font:800 .66rem "Outfit",sans-serif;background:rgba(0,0,0,.35);letter-spacing:.04em}
.new{position:absolute;left:10px;top:10px;z-index:2;background:var(--gold);color:#2a1600;font:900 .62rem "Outfit",sans-serif;padding:2px 8px;border-radius:999px}
.soon{filter:grayscale(.6) brightness(.8)}
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.hud .ttl{flex:1;min-width:0}
.hud .ttl b{display:block;font:800 1rem "Outfit",sans-serif;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .ttl span{font-size:.75rem;color:var(--mut)}
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;gap:8px;overflow:hidden}
#stage.sc{justify-content:flex-start;overflow:auto;align-items:stretch}
canvas{display:block;border-radius:18px;touch-action:none;flex:none;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.dock{display:flex;gap:8px;justify-content:center;padding:6px 10px 12px;flex-wrap:wrap}
.ab{position:relative;min-width:68px;padding:7px 10px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card2);color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit}
.ab b{font-size:1.35rem;line-height:1.1}.ab small{font:700 .66rem "Outfit",sans-serif;color:var(--mut)}
.ab i{font:800 .68rem "Outfit",sans-serif;font-style:normal;color:var(--gold)}
.ab:disabled{opacity:.4}
.map{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 30px}
.node{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;font:900 1.3rem "Outfit",sans-serif;color:#fff;cursor:pointer;position:relative;background:linear-gradient(135deg,#3a4170,#262c52);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35)}
.node.done{background:linear-gradient(135deg,#2EE59D,#13a36e)}
.node.cur{background:linear-gradient(135deg,var(--a1),var(--a2));animation:pulse 1.6s infinite}
.node.lock{opacity:.5}
.node s{position:absolute;bottom:-9px;left:0;right:0;text-decoration:none;font-size:.62rem;color:var(--gold);letter-spacing:1px;text-shadow:0 1px 2px #000}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.7),inset 0 -5px 0 rgba(0,0,0,.25)}50%{box-shadow:0 0 0 14px rgba(124,92,255,0),inset 0 -5px 0 rgba(0,0,0,.25)}}
.sheetbg{position:absolute;inset:0;background:rgba(3,5,18,.62);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(180deg,rgba(40,34,92,.97),rgba(14,18,48,.99));border:1px solid var(--line);animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@media (prefers-color-scheme: light){.sheet{background:linear-gradient(180deg,#fff,#E5E9FF)}}
.sheet h2{margin:0 0 4px;font-size:1.7rem;font-weight:900}
.sheet .sub{color:var(--mut);margin:0 0 10px}
.stars{font-size:2.6rem;letter-spacing:6px;color:var(--gold);text-shadow:0 4px 18px rgba(255,200,61,.5)}
.stars span{display:inline-block;animation:pop .5s both}.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
.stars .off{color:rgba(255,255,255,.2);text-shadow:none}
.rw{display:flex;gap:8px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(10,12,34,.95);color:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;z-index:50;font:600 .9rem "Inter",sans-serif;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.conf{position:absolute;top:-20px;font-size:1.4rem;z-index:40;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.tabs{display:flex;gap:6px;padding:4px;background:var(--card);border-radius:16px;border:1px solid var(--line);margin:4px 0 10px}
.tabs button{flex:1;border:0;border-radius:12px;padding:9px 4px;background:transparent;color:var(--mut);font:700 .85rem "Outfit",sans-serif;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:18px}
.item .em{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(255,79,163,.3));flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font:800 .98rem "Outfit",sans-serif}.item .tx span{display:block;font-size:.78rem;color:var(--mut);line-height:1.25}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a3),var(--ok))}
.mini{font-size:.78rem;color:var(--mut)}
.center{text-align:center}
[hidden]{display:none!important}

.ab.shopb{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,200,61,.22),rgba(255,138,61,.2))}
.ab.shopb i{color:var(--gold)}

.rail{position:absolute;right:6px;top:62px;z-index:8;display:flex;flex-direction:column;gap:7px}
.rail .ab{min-width:0;width:48px;padding:5px 0 3px;background:rgba(8,11,36,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:15px}
.rail .ab b{font-size:1.3rem}.rail .ab small{display:none}.rail .ab i{font-size:.6rem}
.rail .ab.shopb{background:linear-gradient(135deg,rgba(255,200,61,.5),rgba(255,138,61,.45))}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){r=r||Math.random;for(var i=a.length-1;i>0;i--){var k=Math.floor(r()*(i+1)),t=a[i];a[i]=a[k];a[k]=t;}return a;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmt(n){return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
/* ---------- wallet ---------- */
var CK='arc_core_v1',W0={coins:150,gems:10,xp:0,sound:true,music:true,daily:'',games:{},theme:'violet',boost:{coin:0,xp:0}};
try{var _j=JSON.parse(localStorage.getItem(CK));if(_j)W0=Object.assign(W0,_j);}catch(e){}
function save(){try{localStorage.setItem(CK,JSON.stringify(W0));}catch(e){}}
if(!W0.boost)W0.boost={coin:0,xp:0};
var THEMES={violet:['#7C5CFF','#FF4FA3','#22D3EE'],ocean:['#2563EB','#06B6D4','#34D399'],sunset:['#F97316','#EC4899','#FACC15'],emerald:['#10B981','#14B8A6','#A3E635'],pink:['#EC4899','#A855F7','#F472B6']};
function applyTheme(){var t=THEMES[W0.theme]||THEMES.violet,s=document.documentElement.style;s.setProperty('--a1',t[0]);s.setProperty('--a2',t[1]);s.setProperty('--a3',t[2]);}
applyTheme();
function boosted(coins,xp){var r={c:coins,x:xp};if(W0.boost.coin>0){r.c=coins*2;W0.boost.coin--;}if(W0.boost.xp>0){r.x=xp*2;W0.boost.xp--;}return r;}
function G0(id){return W0.games[id]||(W0.games[id]={lv:1,best:0,stars:{},d:{}});}
function plv(){return 1+Math.floor(Math.sqrt(W0.xp/45));}
function pills(){var a=$('pc'),b=$('pg'),c=$('pl');if(a)a.textContent=fmt(W0.coins);if(b)b.textContent=fmt(W0.gems);if(c)c.textContent='LV '+plv();}
function addCoins(n,g){W0.coins+=n;if(g)W0.gems+=g;save();pills();}
function addXp(n){W0.xp+=n;save();pills();}
function spend(n,gem){var k=gem?'gems':'coins';if(W0[k]<n){toast('Not enough '+(gem?'gems':'coins')+' ('+n+' needed)');sfx('bad');return false;}W0[k]-=n;save();pills();sfx('buy');return true;}
/* ---------- audio ---------- */
var AC=null,FG=null,MG=null;
function au(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();FG=AC.createGain();FG.connect(AC.destination);MG=AC.createGain();MG.connect(AC.destination);}catch(e){return;}}
  if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  FG.gain.value=W0.sound?1:0;MG.gain.value=W0.music?1:0;if(Music.style&&!Music.timer)Music.play(Music.style);
}
function tone(f,d,type,v,delay,f2,dest){
  if(!AC||!W0.sound&&!dest)return;
  try{var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(delay||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(v||0.1,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);o.connect(g);g.connect(dest||FG);o.start(t0);o.stop(t0+d+0.02);}catch(e){}
}
function noise(d,fq,v,type,dest,delay){
  if(!AC||!W0.sound&&!dest)return;
  try{var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
    var s=AC.createBufferSource();s.buffer=b;var f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=fq;var g=AC.createGain();g.gain.value=v||0.2;s.connect(f);f.connect(g);g.connect(dest||FG);s.start(AC.currentTime+(delay||0));}catch(e){}
}
function sfx(n){
  if(n==='click')tone(700,.05,'triangle',.07);else if(n==='coin'){tone(1100,.08,'square',.05);tone(1650,.12,'square',.05,.07);}
  else if(n==='buy'){tone(500,.1,'triangle',.1);tone(800,.14,'triangle',.1,.08);}else if(n==='bad')tone(180,.18,'sawtooth',.08);
  else if(n==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,.28,'triangle',.12,i*.11);});}
  else if(n==='lose'){tone(330,.3,'sawtooth',.1,0,110);}
  else if(n==='hit')noise(.07,1500,.14);else if(n==='shoot')tone(900,.07,'square',.04,0,300);
  else if(n==='boom'){noise(.45,160,.35,'lowpass');noise(.2,2000,.12);}else if(n==='power')tone(300,.35,'sine',.12,0,1200);
  else if(n==='tick')tone(1500,.02,'square',.03);else if(n==='zap'){tone(1200,.1,'sawtooth',.05,0,200);}
}
function mf(m){return 440*Math.pow(2,(m-69)/12);}
var MS={
 chill:{bpm:84,ch:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],bass:1,hat:0,bell:.5,sc:[69,72,74,76,79,81]},
 action:{bpm:132,ch:[[57,60,64],[57,60,64],[53,57,60],[55,59,62]],bass:2,hat:1,bell:.25,sc:[69,72,74,76,79]},
 happy:{bpm:108,ch:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],bass:1,hat:0,bell:.6,sc:[72,74,76,79,81]},
 spooky:{bpm:56,ch:[[40,41,47],[38,39,45],[40,41,47],[35,36,42]],bass:0,hat:0,bell:.35,sc:[76,77,82,83],spk:1}
};
var Music={style:'',timer:null,t:0,i:0,
 play:function(s){this.style=s;if(!AC)return;if(!this.timer){this.t=AC.currentTime+0.15;this.i=0;var m=this;this.timer=setInterval(function(){m.tick();},160);}},
 stop:function(){clearInterval(this.timer);this.timer=null;this.style='';},
 tick:function(){
  if(!AC||!MG||!W0.music||document.hidden){if(AC)this.t=Math.max(this.t,AC.currentTime);return;}
  var s=MS[this.style];if(!s)return;var st=60/s.bpm/2;
  while(this.t<AC.currentTime+0.7){
    var i=this.i,t=this.t-AC.currentTime,ch=s.ch[Math.floor(i/8)%4];
    if(i%8===0)ch.forEach(function(m){tone(mf(s.spk?m+12:m),st*8,s.spk?'sine':'triangle',s.spk?.03:.022,t,0,MG);});
    if(s.bass===2&&i%2===0)tone(mf(ch[0]-24),st*1.8,'sawtooth',.03,t,0,MG);
    else if(s.bass===1&&i%4===0)tone(mf(ch[0]-12),st*3,'sine',.05,t,0,MG);
    if(s.hat&&i%2===1)noise(.04,7000,.035,'highpass',MG,t);
    if(s.hat&&i%8===4)noise(.1,900,.05,'lowpass',MG,t);
    if(Math.random()<s.bell*(i%2===0?1:.3)){var m=s.sc[Math.floor(Math.random()*s.sc.length)];tone(mf(m),s.spk?st*4:st*3,'sine',s.spk?.035:.03,t,0,MG);}
    if(s.spk&&i%32===16)noise(1.6,400,.04,'bandpass',MG,t);
    this.i++;this.t+=st;
  }
 }
};
/* ---------- UI helpers ---------- */
var toastT=0;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1900);}
function confetti(){var E=['🎉','⭐','✨','🪙','💎','🎊'];for(var i=0;i<30;i++){var s=el('span','conf',E[rnd(0,E.length-1)]);s.style.left=rnd(0,100)+'%';s.style.animationDelay=(Math.random()*0.5)+'s';s.style.fontSize=rnd(14,28)+'px';$('app').appendChild(s);setTimeout(function(x){return function(){x.remove();};}(s),2600);}}
function sheet(html,btns){
  closeSheet();var bg=el('div','sheetbg'),sh=el('div','sheet',html),row=el('div','btns');
  btns.forEach(function(b){var x=el('button','btn '+(b.c||''),b.t);x.onclick=function(){sfx('click');if(b.keep!==true)closeSheet();b.f&&b.f();};row.appendChild(x);});
  sh.appendChild(row);bg.appendChild(sh);$('app').appendChild(bg);return sh;
}
function closeSheet(){var s=document.querySelector('.sheetbg');if(s)s.remove();}
function countUp(e,to,ms){var t0=performance.now();ms=ms||700;(function f(n){var k=Math.min(1,(n-t0)/ms);e.textContent=fmt(to*k);if(k<1)requestAnimationFrame(f);})(t0);}
/* ---------- registry & router ---------- */
var GAMES={},ORDER=[],view='hub',cur=null,cleanups=[];
function reg(g){GAMES[g.id]=g;ORDER.push(g.id);}

/* ===== Number Link ===== */
reg({id:'link',name:'Neon Link',ico:'🔗',art:['#0891B2','#7C3AED'],tag:'LEVELS ∞',kind:'levels',desc:'Connect matching dots without crossing. Endless puzzles.',sub:'',music:'chill',play:function(ctx){
  var lv=ctx.level,n=Math.min(9,5+Math.floor(lv/6)),k=Math.min(n+1,3+Math.floor(lv/3)),r=ctx.rng(lv*911+5),S=360,cs=Math.floor(S/n),W=cs*n,H=cs*n,cv=ctx.cvs(W,H),c=cv.x,i,j;
  var COL=['#ef4444','#3b82f6','#22c55e','#facc15','#a855f7','#f97316','#14b8a6','#ec4899','#84cc16','#38bdf8'];
  var own=[],sol=[];function reset(){own=[];for(j=0;j<n;j++){own.push([]);for(i=0;i<n;i++)own[j].push(-1);}}
  var taken=[];for(j=0;j<n;j++){taken.push([]);for(i=0;i<n;i++)taken[j].push(false);}
  var pairs=[],tries=0;
  while(pairs.length<k&&tries<400){tries++;
    var sx=Math.floor(r()*n),sy=Math.floor(r()*n);if(taken[sy][sx])continue;var path=[[sx,sy]],L=rnd(4,n+3),st=0;
    while(path.length<L&&st<60){st++;var last=path[path.length-1],ds=ctx.shuffle([[1,0],[-1,0],[0,1],[0,-1]],r),mv=false;
      for(var q=0;q<4;q++){var nx=last[0]+ds[q][0],ny=last[1]+ds[q][1];if(nx<0||ny<0||nx>=n||ny>=n||taken[ny][nx])continue;if(path.some(function(p){return p[0]===nx&&p[1]===ny;}))continue;path.push([nx,ny]);mv=true;break;}
      if(!mv)break;}
    if(path.length>=3){path.forEach(function(p){taken[p[1]][p[0]]=true;});pairs.push({a:path[0],b:path[path.length-1],sol:path});}
  }
  k=pairs.length;reset();
  var P=pairs.map(function(){return [];}),done=false,t0=Date.now(),drag=-1;
  function isEnd(x,y){for(var q=0;q<k;q++){if(pairs[q].a[0]===x&&pairs[q].a[1]===y)return q;if(pairs[q].b[0]===x&&pairs[q].b[1]===y)return q;}return -1;}
  function comp(q){var p=P[q];if(p.length<2)return false;var l=p[p.length-1],e=pairs[q];return (l[0]===e.a[0]&&l[1]===e.a[1]&&p[0][0]===e.b[0]&&p[0][1]===e.b[1])||(l[0]===e.b[0]&&l[1]===e.b[1]&&p[0][0]===e.a[0]&&p[0][1]===e.a[1]);}
  function trunc(q,idx){var p=P[q];while(p.length>idx){var x=p.pop();own[x[1]][x[0]]=-1;}}
  function check(){var cnt=0;for(var q=0;q<k;q++)if(comp(q))cnt++;ctx.hud('Level '+lv+' · '+cnt+'/'+k+' linked');if(cnt===k&&!done){done=true;var sec=(Date.now()-t0)/1000,st=sec<n*7?3:(sec<n*15?2:1);setTimeout(function(){ctx.win({stars:st,coins:20+lv*4+st*8,note:'Solved in '+Math.round(sec)+'s'});},300);}}
  function draw(){
    cv.begin();c.fillStyle='#0b1030';c.fillRect(0,0,W,H);c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1;for(i=0;i<=n;i++){c.beginPath();c.moveTo(i*cs,0);c.lineTo(i*cs,H);c.stroke();c.beginPath();c.moveTo(0,i*cs);c.lineTo(W,i*cs);c.stroke();}
    P.forEach(function(p,q){if(p.length<1)return;c.strokeStyle=COL[q];c.lineWidth=cs*0.4;c.lineCap='round';c.lineJoin='round';c.shadowColor=COL[q];c.shadowBlur=comp(q)?14:4;c.beginPath();p.forEach(function(s,z){var x=s[0]*cs+cs/2,y=s[1]*cs+cs/2;if(z)c.lineTo(x,y);else c.moveTo(x,y);});c.stroke();c.shadowBlur=0;});
    pairs.forEach(function(pr,q){[pr.a,pr.b].forEach(function(e){c.fillStyle=COL[q];c.shadowColor=COL[q];c.shadowBlur=16;c.beginPath();c.arc(e[0]*cs+cs/2,e[1]*cs+cs/2,cs*0.3,0,7);c.fill();c.shadowBlur=0;c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(e[0]*cs+cs/2-cs*.08,e[1]*cs+cs/2-cs*.08,cs*0.09,0,7);c.fill();});});
  }
  ctx.loop(function(){draw();});
  function cell(e){var p=cv.pt(e);return [Math.floor(p.x/cs),Math.floor(p.y/cs)];}
  cv.c.addEventListener('pointerdown',function(e){if(done)return;try{cv.c.setPointerCapture(e.pointerId);}catch(x){}var p=cell(e),x=p[0],y=p[1];if(x<0||y<0||x>=n||y>=n)return;
    var en=isEnd(x,y);if(en>=0){trunc(en,0);P[en]=[[x,y]];own[y][x]=en;drag=en;ctx.sfx('tick');}
    else if(own[y][x]>=0){var q=own[y][x],idx=P[q].findIndex(function(s){return s[0]===x&&s[1]===y;});trunc(q,idx+1);drag=q;ctx.sfx('tick');}check();});
  cv.c.addEventListener('pointermove',function(e){if(drag<0||done)return;var p=cell(e),x=p[0],y=p[1];if(x<0||y<0||x>=n||y>=n)return;var pa=P[drag],l=pa[pa.length-1];if(l[0]===x&&l[1]===y)return;if(Math.abs(l[0]-x)+Math.abs(l[1]-y)!==1)return;

    var ex=pa.findIndex(function(s){return s[0]===x&&s[1]===y;});if(ex>=0){trunc(drag,ex+1);return;}

    if(own[y][x]>=0&&own[y][x]!==drag){var q=own[y][x],idx=P[q].findIndex(function(s){return s[0]===x&&s[1]===y;});trunc(q,idx);}

  function up(){drag=-1;}cv.c.addEventListener('pointerup',up);cv.c.addEventListener('pointercancel',up);
  ctx.dock([{ico:'💡',name:'Hint',cost:25,fn:function(){var q=-1;for(var z=0;z<k;z++)if(!comp(z)){q=z;break;}if(q<0)return false;trunc(q,0);pairs[q].sol.forEach(function(s){var o=own[s[1]][s[0]];if(o>=0&&o!==q)trunc(o,P[o].findIndex(function(m){return m[0]===s[0]&&m[1]===s[1];}));P[q].push([s[0],s[1]]);own[s[1]][s[0]]=q;});ctx.sfx('power');check();}},{ico:'🧹',name:'Clear',cost:0,fn:function(){for(var z=0;z<k;z++)trunc(z,0);check();}}]);

}});

reg({id:'snake',name:'Snake Rush',ico:'🎲',art:['#F59E0B','#DC2626'],tag:'LEVELS ∞',kind:'levels',desc:'Race the CPU to 100. Dodge snakes, climb ladders, use power-ups.',sub:'',music:'happy',play:function(ctx){
  var lv=ctx.level,r=ctx.rng(lv*313+9),S=360,cv=ctx.cvs(360,470),c=cv.x,cs=36,OY=4,i,opp=Math.min(3,1+Math.floor(lv/4)),CP=['#ef4444','#3b82f6','#22c55e','#f59e0b'];
  var jumps={},used={};var nl=6,ns=Math.min(12,5+Math.floor(lv/2));
  function place(up,cnt){var tries=0,m=0;while(m<cnt&&tries<300){tries++;var a=rnd(2,97),len=rnd(8,40),b=up?a+len:a-len;if(b<2||b>99)continue;var lo=Math.min(a,b),hi=Math.max(a,b);if(used[a]||used[b])continue;used[a]=used[b]=1;jumps[up?a:hi]=up?b:lo;m++;}}
  place(true,nl);place(false,ns);
  function xy(n){var q=n-1,row=Math.floor(q/10),col=q%10;if(row%2)col=9-col;return {x:col*cs+cs/2,y:OY+(9-row)*cs+cs/2};}
  var pl=[{p:1,sh:0,me:true}];for(i=0;i<opp;i++)pl.push({p:1,sh:0});

  function next(){var w=pl.filter(function(q){return q.p>=100;})[0];if(w){done=true;if(w.me){var st=turns<=16?3:(turns<=26?2:1);setTimeout(function(){ctx.win({stars:st,coins:20+lv*4+st*8,note:'You won in '+turns+' turns!'});},400);}else setTimeout(function(){ctx.lose({note:'The CPU reached 100 first.'});},400);return;}
    turn=(turn+1)%pl.length;if(!pl[turn].me){msg='CPU '+turn+' is rolling...';setTimeout(function(){doRoll();},700);}else msg='Your turn: tap ROLL';}
  function doRoll(){if(roll||done)return;roll=true;rt=0.6;ctx.sfx('click');setTimeout(function(){var v=(pl[turn].me&&forced)?forced:rnd(1,6);forced=0;dice=v;roll=false;if(pl[turn].me)turns++;var steps=v;if(pl[turn].me&&boost){steps+=boost;boost=0;}if(pl[turn].p+steps>100)steps=100-pl[turn].p;move(pl[turn],steps,next);},650);}
  function draw(){

    Object.keys(jumps).forEach(function(a){a=+a;var b=jumps[a],p=xy(a),q=xy(b),up=b>a;c.strokeStyle=up?'#facc15':'#ef4444';c.lineWidth=up?5:7;c.lineCap='round';c.globalAlpha=0.9;c.beginPath();if(up){c.moveTo(p.x-5,p.y);c.lineTo(q.x-5,q.y);c.moveTo(p.x+5,p.y);c.lineTo(q.x+5,q.y);}else{c.moveTo(p.x,p.y);c.bezierCurveTo(p.x+30,(p.y+q.y)/2,q.x-30,(p.y+q.y)/2,q.x,q.y);}c.stroke();c.globalAlpha=1;c.font='16px sans-serif';c.textAlign='center';c.fillText(up?'🪜':'🐍',up?q.x:p.x,(up?q.y:p.y)+6);});

    c.fillStyle='rgba(255,255,255,.08)';c.fillRect(0,370,360,100);c.fillStyle='#c7d2fe';c.font='700 14px Outfit';c.textAlign='left';c.fillText(msg,14,396);

    var my=pl[turn].me&&!roll&&!done;c.fillStyle=my?'#7c5cff':'rgba(255,255,255,.12)';c.beginPath();c.roundRect?c.roundRect(14,408,150,44,14):c.rect(14,408,150,44);c.fill();c.fillStyle='#fff';c.font='800 17px Outfit';c.textAlign='center';c.fillText('ROLL 🎲',89,436);
    c.fillStyle='#94a3b8';c.font='600 11px Inter';c.textAlign='left';c.fillText('You are red · '+opp+' CPU '+(opp>1?'players':'player'),180,440);
  }
  ctx.loop(function(dt){if(roll)rt-=dt;draw();});
  cv.c.addEventListener('pointerdown',function(e){var p=cv.pt(e);if(p.x>14&&p.x<164&&p.y>408&&p.y<452&&pl[turn].me&&!roll&&!done)doRoll();});
